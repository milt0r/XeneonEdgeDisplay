<!doctype html>
<html class="theme-pipboy">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { background: #062012; padding: 18px 20px; }
  .name { font-family: 'Monoton','VT323',monospace; font-size: 18px; color: var(--accent); letter-spacing: 0.08em; margin-bottom: 16px; }
  .row { display: flex; align-items: flex-end; gap: 24px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .target {
    border: 1px solid var(--accent);
    background: var(--accent-soft);
    color: var(--accent-hot);
    display: flex; align-items: center; justify-content: center;
    font-family: 'VT323', monospace; font-size: 20px;
    border-radius: 4px;
  }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); letter-spacing: 0.15em; text-transform: uppercase; }
  .role { font-family: var(--font-mono); font-size: 11px; color: var(--fg); letter-spacing: 0.12em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="name">HIT-TARGET FLOOR · TOUCH-FIRST</div>
  <div class="row">
    <div class="item">
      <div class="target" style="width:44px; height:44px">⚙</div>
      <div class="role">Default</div>
      <div class="px">44 × 44</div>
    </div>
    <div class="item">
      <div class="target" style="width:56px; height:56px">⌨</div>
      <div class="role">Keyboard key</div>
      <div class="px">56 tall</div>
    </div>
    <div class="item">
      <div class="target" style="width:72px; height:72px; font-size:28px">▶</div>
      <div class="role">Transport</div>
      <div class="px">72 × 72</div>
    </div>
    <div class="item">
      <div class="target" style="width:120px; height:96px; font-size:30px">●</div>
      <div class="role">Big toggle</div>
      <div class="px">≥ 96 tall</div>
    </div>
  </div>
</body>
</html>
