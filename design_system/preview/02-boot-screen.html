<!doctype html>
<html class="theme-pipboy">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { background: #020a04; padding: 22px 24px; }
  pre {
    margin: 0;
    font-family: 'VT323', monospace;
    font-size: 22px;
    line-height: 1.25;
    color: var(--accent);
    text-shadow: 0 0 5px var(--accent), 0 0 14px rgba(124,255,138,0.25);
  }
  .line.tiny { color: var(--fg-muted); text-shadow: none; }
  .cursor { background: var(--accent); display: inline-block; width: 12px; height: 22px; vertical-align: -4px; margin-left: 2px; animation: bb 0.7s steps(1) infinite; }
  @keyframes bb { 50% { opacity: 0; } }
</style>
</head>
<body>
<pre><span class="line">&gt; XENEON-EDGE BIOS v3.7.4</span>
<span class="line">&gt; Memory check: 32768 KB OK</span>
<span class="line">&gt; Initializing widget grid...</span>
<span class="line">&gt; Loading themes... [pipboy, dark, synthwave, nord]</span>
<span class="line">&gt; Touch interface: ENABLED</span>
<span class="line">&gt; Vault-Tec Industries (c)<span class="cursor"></span></span></pre>
</body>
</html>
