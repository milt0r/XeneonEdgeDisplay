<!doctype html>
<html class="theme-pipboy">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { background: #062012; padding: 18px 20px; }
  .name { font-family: 'Monoton','VT323',monospace; font-size: 18px; color: var(--accent); letter-spacing: 0.08em; margin-bottom: 14px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); letter-spacing: 0.15em; text-transform: uppercase; text-align: center; }
  .btn {
    font-family: 'VT323', monospace;
    font-size: 18px;
    letter-spacing: 0.12em;
    background: var(--bg-panel);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 18px;
    min-height: 44px;
    cursor: pointer;
    text-transform: uppercase;
  }
  .btn.hover, .btn.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent-hot);
  }
</style>
</head>
<body>
  <div class="name">BUTTONS · IDLE / HOVER / ACTIVE</div>
  <div class="grid">
    <div class="stack">
      <button class="btn">SETTINGS</button>
      <div class="meta">Idle</div>
    </div>
    <div class="stack">
      <button class="btn hover">SETTINGS</button>
      <div class="meta">Hover / pressed</div>
    </div>
    <div class="stack">
      <button class="btn active">DONE</button>
      <div class="meta">Active state</div>
    </div>
  </div>
</body>
</html>
