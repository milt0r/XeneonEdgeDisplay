<!doctype html>
<html class="theme-pipboy">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { background: #020a04; padding: 18px 20px; }
  .name { font-family: 'Monoton','VT323',monospace; font-size: 18px; color: var(--accent); letter-spacing: 0.08em; margin-bottom: 14px; }
  .widget {
    width: 100%;
    background: rgba(6,32,18,0.85);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: inset 0 0 30px rgba(124,255,138,0.05);
  }
  .widget-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 10px;
    background: var(--bg-elevated);
    border-bottom: 1px solid var(--border);
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--fg-muted);
  }
  .widget-title { color: var(--accent); }
  .actions { display: inline-flex; gap: 6px; }
  .iconbtn {
    background: transparent; border: 1px solid var(--border);
    color: var(--fg-muted); width: 28px; height: 28px;
    border-radius: 4px; font-size: 14px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .iconbtn.on { background: var(--accent-soft); color: var(--accent-hot); border-color: var(--accent); }
  .body { padding: 14px; display: flex; align-items: center; justify-content: center; min-height: 110px; gap: 10px; flex-direction: column; }
  .time { font-family: 'Monoton','VT323',monospace; font-size: 64px; line-height: 1; color: var(--accent); text-shadow: 0 0 6px var(--accent), 0 0 18px rgba(124,255,138,0.3); }
  .date { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.15em; color: var(--fg-muted); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="name">WIDGET FRAME</div>
  <div class="widget">
    <div class="widget-header">
      <span class="widget-title">CLOCK</span>
      <span class="actions">
        <button class="iconbtn on" title="Configure">⚙</button>
        <button class="iconbtn" title="Remove">✕</button>
      </span>
    </div>
    <div class="body">
      <div class="time">12:48</div>
      <div class="date">FRI · MAY 12</div>
    </div>
  </div>
</body>
</html>
