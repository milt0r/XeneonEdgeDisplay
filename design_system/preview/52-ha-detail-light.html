<!doctype html>
<html class="theme-pipboy">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { background: #020a04; padding: 14px 18px; }
  .modal {
    background: rgba(6,32,18,0.95);
    border: 1px solid var(--accent);
    border-radius: 4px;
    box-shadow: 0 12px 60px rgba(0,0,0,0.7);
    overflow: hidden;
  }
  .header {
    display: flex; gap: 14px; align-items: center;
    background: var(--bg-elevated);
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .icon-box { color: var(--accent); display: inline-flex; }
  .titles { flex: 1; min-width: 0; }
  .nm { font-family: 'Monoton','VT323',monospace; font-size: 20px; color: var(--accent); line-height: 1; }
  .id { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); margin-top: 4px; letter-spacing: 0.12em; }
  .close {
    background: transparent; border: 1px solid var(--border); color: var(--fg);
    border-radius: 4px; min-height: 36px; padding: 0 10px;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em;
  }
  .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }

  .big-toggle {
    width: 100%; min-height: 80px;
    background: var(--accent-soft); border: 2px solid var(--accent);
    color: var(--accent-hot);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    box-shadow: 0 0 20px var(--accent-soft);
  }
  .big-toggle .k { font-family: 'Monoton','VT323',monospace; font-size: 28px; }
  .big-toggle .l { font-family: var(--font-mono); font-size: 12px; opacity: 0.8; text-transform: uppercase; letter-spacing: 0.18em; }

  .slider { display: flex; flex-direction: column; gap: 8px; }
  .slider-row { display: flex; justify-content: space-between; align-items: baseline; }
  .slider-lbl { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-muted); }
  .slider-val { font-family: 'Monoton','VT323',monospace; font-size: 22px; color: var(--accent); }
  .track { position: relative; height: 32px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 16px; }
  .fill { position: absolute; top: 0; left: 0; bottom: 0; border-radius: 16px; background: var(--accent); }
  .fill.ct { background: linear-gradient(90deg, #ffb14a, #fff5e0, #c8e0ff); }
  .thumb { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--bg-panel); box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
</style>
</head>
<body>
  <div class="modal">
    <div class="header">
      <span class="icon-box">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="9" r="5"/><path d="M9 18h6M10 21h4"/></svg>
      </span>
      <div class="titles">
        <div class="nm">Living Room — Floor Lamp</div>
        <div class="id">light.living_room_floor_lamp</div>
      </div>
      <button class="close">CLOSE ✕</button>
    </div>
    <div class="body">
      <div class="big-toggle">
        <span class="k">ON</span>
        <span class="l">Tap to toggle</span>
      </div>
      <div class="slider">
        <div class="slider-row"><span class="slider-lbl">BRIGHTNESS</span><span class="slider-val">78%</span></div>
        <div class="track">
          <div class="fill" style="width:78%"></div>
          <div class="thumb" style="left:78%; background:var(--accent)"></div>
        </div>
      </div>
      <div class="slider">
        <div class="slider-row"><span class="slider-lbl">COLOR TEMPERATURE</span><span class="slider-val">3200K</span></div>
        <div class="track">
          <div class="fill ct" style="width:100%"></div>
          <div class="thumb" style="left:24%; background:#ffc878"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
