<!doctype html>
<html class="theme-pipboy">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { background: radial-gradient(ellipse at 50% 60%, rgba(31,122,53,0.35), transparent 70%), #020a04; padding: 26px 24px; }
  .mark {
    font-family: 'Monoton', 'VT323', monospace;
    font-size: 78px;
    color: var(--accent);
    letter-spacing: 0.18em;
    line-height: 1;
    text-shadow: 0 0 6px var(--accent), 0 0 22px rgba(124,255,138,0.25);
  }
  .slashes { color: var(--accent-hot); opacity: 0.85; }
  .sub {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.32em;
    color: var(--fg-muted);
    margin-top: 14px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="mark">XENEON<span class="slashes">//</span>EDGE</div>
  <div class="sub">Vault-Tec approved · CRT terminal aesthetic · v3.7.4</div>
</body>
</html>
