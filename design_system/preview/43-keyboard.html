<!doctype html>
<html class="theme-pipboy">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { background: #062012; padding: 18px 20px; }
  .name { font-family: 'Monoton','VT323',monospace; font-size: 18px; color: var(--accent); letter-spacing: 0.08em; margin-bottom: 14px; }
  .kb { background: rgba(6,32,18,0.95); border: 1px solid var(--border); border-top: 2px solid var(--accent); border-radius: 4px; padding: 6px; }
  .row { display: flex; gap: 4px; margin-bottom: 4px; }
  .key {
    flex: 1 1 0;
    height: 40px;
    border-radius: 3px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--fg);
    font-family: 'VT323', monospace; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  .key.wide { flex: 1.4 1 0; font-size: 12px; letter-spacing: 0.1em; }
  .key.space { flex: 6 1 0; }
  .key.accent { background: var(--accent-soft); color: var(--accent-hot); border-color: var(--accent); }
  .bar { display: flex; justify-content: space-between; padding: 4px 4px 6px; }
  .label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--fg-muted); }
</style>
</head>
<body>
  <div class="name">ON-SCREEN KEYBOARD · 56-PX KEYS</div>
  <div class="kb">
    <div class="bar"><span class="label">QWERTY · ASCII</span><span class="label">CLOSE ✕</span></div>
    <div class="row"><div class="key">q</div><div class="key">w</div><div class="key">e</div><div class="key">r</div><div class="key">t</div><div class="key">y</div><div class="key">u</div><div class="key">i</div><div class="key">o</div><div class="key">p</div></div>
    <div class="row"><div class="key wide">⇧</div><div class="key">a</div><div class="key">s</div><div class="key">d</div><div class="key">f</div><div class="key">g</div><div class="key">h</div><div class="key">j</div><div class="key">k</div><div class="key">l</div></div>
    <div class="row"><div class="key wide">123</div><div class="key">z</div><div class="key">x</div><div class="key">c</div><div class="key">v</div><div class="key">b</div><div class="key">n</div><div class="key">m</div><div class="key wide">⌫</div></div>
    <div class="row"><div class="key wide">ABC</div><div class="key space">SPACE</div><div class="key wide accent">↵</div></div>
  </div>
</body>
</html>
