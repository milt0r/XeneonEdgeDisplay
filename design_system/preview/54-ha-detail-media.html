<!doctype html>
<html class="theme-pipboy">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { background: #020a04; padding: 14px 18px; }
  .modal {
    background: rgba(6,32,18,0.95);
    border: 1px solid var(--accent);
    border-radius: 4px;
    box-shadow: 0 12px 60px rgba(0,0,0,0.7);
    overflow: hidden;
  }
  .header {
    display: flex; gap: 14px; align-items: center;
    background: var(--bg-elevated);
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .titles { flex: 1; min-width: 0; }
  .nm { font-family: 'Monoton','VT323',monospace; font-size: 20px; color: var(--accent); line-height: 1; }
  .id { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); margin-top: 4px; letter-spacing: 0.12em; }
  .close {
    background: transparent; border: 1px solid var(--border); color: var(--fg);
    border-radius: 4px; min-height: 36px; padding: 0 10px;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em;
  }
  .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }

  .lbl { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--fg-muted); }
  .title { font-family: 'Monoton','VT323',monospace; font-size: 24px; color: var(--accent); line-height: 1.1; }
  .artist { font-family: var(--font-mono); font-size: 12px; color: var(--fg-muted); margin-top: 2px; }

  .transport { display: flex; gap: 8px; align-items: center; }
  .tbtn {
    background: var(--bg-panel); color: var(--fg);
    border: 1px solid var(--border); border-radius: 4px;
    width: 56px; height: 56px;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: 'VT323', monospace; font-size: 22px;
  }
  .tbtn.active { background: var(--accent-soft); color: var(--accent-hot); border-color: var(--accent); }

  .slider { display: flex; flex-direction: column; gap: 8px; }
  .slider-row { display: flex; justify-content: space-between; align-items: baseline; }
  .slider-val { font-family: 'Monoton','VT323',monospace; font-size: 22px; color: var(--accent); }
  .track { position: relative; height: 32px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 16px; }
  .fill { position: absolute; top: 0; left: 0; bottom: 0; border-radius: 16px; background: var(--accent); }
  .thumb { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 28px; height: 28px; border-radius: 50%; background: var(--accent); border: 3px solid var(--bg-panel); box-shadow: 0 2px 8px rgba(0,0,0,0.4); }

  .sources { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: var(--bg-elevated); color: var(--fg-muted);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 14px; min-height: 36px;
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase;
    display: inline-flex; align-items: center;
  }
  .chip.active { background: var(--accent-soft); color: var(--accent-hot); border-color: var(--accent); }
</style>
</head>
<body>
  <div class="modal">
    <div class="header">
      <span style="color:var(--accent); display:inline-flex">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><polygon points="9,7 18,12 9,17" fill="currentColor" stroke="none"/></svg>
      </span>
      <div class="titles">
        <div class="nm">Kitchen Speaker</div>
        <div class="id">media_player.kitchen_sonos</div>
      </div>
      <button class="close">CLOSE ✕</button>
    </div>
    <div class="body">
      <div class="lbl">Now playing</div>
      <div class="title">Atomic Heart Bar</div>
      <div class="artist">Mick Gordon · Doom Eternal OST</div>
      <div class="transport">
        <button class="tbtn">⏮</button>
        <button class="tbtn active">⏸</button>
        <button class="tbtn">⏭</button>
        <button class="tbtn">⏹</button>
      </div>
      <div class="slider">
        <div class="slider-row"><span class="lbl">VOLUME</span><span class="slider-val">42%</span></div>
        <div class="track">
          <div class="fill" style="width:42%"></div>
          <div class="thumb" style="left:42%"></div>
        </div>
      </div>
      <div class="lbl">Source</div>
      <div class="sources">
        <span class="chip active">spotify</span>
        <span class="chip">tunein</span>
        <span class="chip">tv</span>
        <span class="chip">aux</span>
        <span class="chip">airplay</span>
      </div>
    </div>
  </div>
</body>
</html>
