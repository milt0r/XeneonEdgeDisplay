<!doctype html>
<html class="theme-pipboy">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
  body { background: #062012; padding: 18px 20px; }
  .name { font-family: 'Monoton','VT323',monospace; font-size: 18px; color: var(--accent); letter-spacing: 0.08em; margin-bottom: 14px; }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .chip {
    background: var(--bg-elevated); border: 1px solid var(--border);
    background: var(--accent-soft); color: var(--accent-hot);
    width: 92px; height: 60px; display: flex; align-items: center; justify-content: center;
    font-family: 'VT323', monospace; font-size: 22px;
  }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); letter-spacing: 0.15em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="name">CORNER RADIUS · BY THEME VIBE</div>
  <div class="row">
    <div class="item"><div class="chip" style="border-radius:0">0px</div><div class="meta">BBS · 8-bit · Doom</div></div>
    <div class="item"><div class="chip" style="border-radius:2px">2px</div><div class="meta">Cyberpunk · F1</div></div>
    <div class="item"><div class="chip" style="border-radius:4px">4px</div><div class="meta">Pip-Boy · Halo</div></div>
    <div class="item"><div class="chip" style="border-radius:6px">6px</div><div class="meta">Synthwave · Tokyo</div></div>
    <div class="item"><div class="chip" style="border-radius:10px">10px</div><div class="meta">Nord</div></div>
    <div class="item"><div class="chip" style="border-radius:12px">12px</div><div class="meta">Dark</div></div>
    <div class="item"><div class="chip" style="border-radius:24px">24px</div><div class="meta">LCARS</div></div>
  </div>
</body>
</html>
